baselines:
- Pendulum MPC
- Spring-mass MPC
- Two-mode spring-mass MPC
- ZV input shaping
- Learned MPC (no context)
ablations:
- history 10
- history 0 (no encoder)
- 10k transitions
- 1k transitions
- cart only
- cart + force/torque
- cart + camera proxy
- horizon 15
- horizon 45
- 32 samples
- 128 samples
