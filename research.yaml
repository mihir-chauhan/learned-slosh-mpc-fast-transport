  spill_rate:
    higher_is_better: false
  peak_disp:
    higher_is_better: false
  arrive_rate:
    higher_is_better: true
  pred_rmse_1:
    higher_is_better: false
  pred_rmse_20:
    higher_is_better: false
  solve_ms:
    higher_is_better: false
    nondeterministic: true
seeds:
- 0
- 1
- 2
- 3
- 4
compute:
